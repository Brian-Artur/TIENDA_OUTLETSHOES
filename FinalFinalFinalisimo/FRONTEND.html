    <script>
      let lastHistoricoData = [];

      function exportarTablaAExcel() {
        const tabla = document.querySelector("#table-container table");
        if (!tabla) return alert("No hay tabla para exportar.");

        let csv = [];
        for (let fila of tabla.rows) {
          let row = [];
          for (let celda of fila.cells) {
            row.push('"' + celda.innerText.replace(/"/g, '""') + '"');
          }
          csv.push(row.join(","));
        }

        const blob = new Blob([csv.join("\n")], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "existencias.csv";
        link.click();
      }

      async function exportarTablaAPDF() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("La librería jsPDF no está cargada correctamente.");
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: "landscape",
          unit: "pt",
          format: "a4",
        });

        const tabla = document.querySelector("#table-container table");
        if (!tabla) {
          alert("No hay tabla para exportar.");
          return;
        }

        const fechaInicio =
          document.getElementById("fecha-ventas")?.value ||
          "Fecha inicio no seleccionada";
        const fechaFin =
          document.getElementById("fecha-final")?.value ||
          "Fecha final no seleccionada";

        const filas = Array.from(tabla.querySelectorAll("tr"));
        const headRows = [];
        const bodyRows = [];
        let inHeader = true;

        for (const fila of filas) {
          const row = [];
          for (const cell of fila.children) {
            const colspan = parseInt(cell.getAttribute("colspan") || "1");
            const text = cell.innerText.trim();
            for (let i = 0; i < colspan; i++) {
              row.push(i === 0 ? text : "");
            }
          }

          if (inHeader && fila.querySelectorAll("th").length > 0) {
            headRows.push(row);
          } else {
            inHeader = false;
            bodyRows.push(row);
          }
        }

        // Dibujar encabezado solo en la primera hoja
        const marginLeft = 40;
        const headerStartY = 40;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.setTextColor(40);
        doc.text(
          "CUADRO DE BENEFICIOS POR PROVEEDOR - CALZADOS BREOGÁN, S.L.",
          marginLeft,
          headerStartY
        );

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(
          `Fechas seleccionadas: ${fechaInicio} a ${fechaFin}`,
          marginLeft,
          headerStartY + 20
        );

        // Dibujar tabla dejando espacio para el encabezado solo en la primera página
        doc.autoTable({
          head: headRows,
          body: bodyRows,
          startY: headerStartY + 40,
          margin: { left: marginLeft, right: marginLeft },
          theme: "grid",
          styles: {
            fontSize: 6,
            cellPadding: 2,
            overflow: "linebreak",
          },
          headStyles: {
            fillColor: [230, 230, 230],
            textColor: 20,
            fontSize: 7,
          },
        });

        doc.save("cuadro-beneficios.pdf");
      }
    </script>

      // Función para renderizar la tabla de existencias

      /**
       *? Tabla "Ventas" Nueva */

      function renderTableExistencias(data) {
        setTimeout(() => {
          generarCheckboxTemporadas();
        }, 100);

        if (!data || !Array.isArray(data)) {
          tableContainer.innerHTML =
            '<p class="error">Invalid "data" field.</p>';
          return;
        }

        // Obtener proveedores únicos
        const proveedoresUnicos = Array.from(
          new Set(data.map((item) => item.PROVEEDOR).filter(Boolean))
        );

        // Determinar qué columnas de tallas tienen al menos un valor distinto de 0.0
        const columnasConDatos = new Set();

        // Campos fijos que siempre mostraremos
        const camposFijos = [
          "CODARTICULO",
          "REFERENCIA",
          "DESCRIPCION",
          "TOTAL",
          "PVP",
          "TEMPORADA",
        ];

        // Analizar todas las columnas de tallas (T18 a T48)
        for (let i = 18; i <= 48; i++) {
          const columna = `T${i}`;
          const tieneDatos = data.some(
            (item) => item[columna] !== 0.0 && item[columna] !== null
          );
          if (tieneDatos) {
            columnasConDatos.add(columna);
          }
        }

        // Ordenar las columnas con datos numéricamente
        const columnasOrdenadas = Array.from(columnasConDatos).sort((a, b) => {
          const numA = parseInt(a.substring(1));
          const numB = parseInt(b.substring(1));
          return numA - numB;
        });

        // Crear una fila superior de título
        const filaProveedor = `
        <tr>
            <td colspan="${
              camposFijos.length + columnasOrdenadas.length + 1
            }" style="font-weight: bold; background-color: #f0f0f0; padding: 10px; text-align: left;">
                EXISTENCIAS DEL PROVEEDOR: ${proveedoresUnicos.join(", ")}
            </td>
        </tr>
    `;

        // Crear los encabezados de las columnas
        let headers = camposFijos
          .map(
            (campo) =>
              `<th style="font-size: 12px">${
                campo === "CODARTICULO"
                  ? "CODIGO"
                  : campo === "REFERENCIA"
                  ? "REF"
                  : campo === "DESCRIPCION"
                  ? "DESCRIPCIÓN"
                  : campo
              }</th>`
          )
          .join("");

        // Añadir encabezados de tallas con datos
        headers += columnasOrdenadas
          .map((col) => `<th style="font-size: 12px">${col.substring(1)}</th>`)
          .join("");

        // Añadir columna de acciones
        headers += `<th style="font-size: 12px"></th>`;

        // Crear la tabla con encabezados fijos
        let tableHtml = `
       <table>
            <thead>
                ${filaProveedor}
                <tr>
                    ${headers}
                </tr>
            </thead>
        <tbody>
    `;

        // Iterar sobre cada registro y agregarlo como una fila
        data.forEach((record, index) => {
          let row = camposFijos
            .map((campo) => {
              if (campo === "CODARTICULO" || campo === "REFERENCIA") {
                return `<td style="font-size: 10px">${record[campo]}</td>`;
              } else if (campo === "DESCRIPCION") {
                return `<td style="font-size: 10px">${record[campo]}</td>`;
              } else {
                return `<td style="font-size: 10px">${record[campo]}</td>`;
              }
            })
            .join("");

          // Añadir celdas de tallas con datos
          row += columnasOrdenadas
            .map((col) => {
              const valor = record[col];
              return `<td style="font-size: 10px; background-color: ${
                valor !== null && valor !== 0 ? "yellow" : "transparent"
              }; 
                    color: ${
                      valor !== null && valor !== 0 ? "black" : "black"
                    };">
                    ${valor === null || valor === 0 ? "" : valor}
                </td>`;
            })
            .join("");

          // Añadir botón de acciones
          row += `<td><button class="button_stock" onclick="showDetailsStocks('${record.REFERENCIA}', ${index})">Stocks</button></td>`;

          tableHtml += `<tr id="existencia-row-${index}">${row}</tr>`;
        });

        // Cerrar la tabla
        tableHtml += `
            </tbody>
        </table>
    `;

        // Agregar la tabla al contenedor
        let filtrosHtml = `
        <strong>Filtrar por temporada:</strong>
        <label><input type="checkbox" value="V25" onchange="filtrarPorTemporada()"> V25</label>
        <label><input type="checkbox" value="V14" onchange="filtrarPorTemporada()"> V14</label>
    `;
        document.getElementById("filtros-temporada").innerHTML = filtrosHtml;
        tableContainer.innerHTML = tableHtml;
      }

      async function showDetailsStocks(referencia, index) {
        const detailsRowId = `details-row-${index}`;
        let detailsRow = document.getElementById(detailsRowId);

        // Verificar si ya existe la fila de detalles
        if (document.getElementById(detailsRowId)) {
          const existingRow = document.getElementById(detailsRowId);
          existingRow.style.display =
            existingRow.style.display === "none" ? "table-row" : "none";
          return;
        }

        // Crear/mostrar fila de carga
        if (detailsRow) {
          detailsRow.innerHTML = `<td colspan="7">Cargando stock actual...</td>`;
        } else {
          const mainRow =
            document.getElementById(`row-${index}`) ||
            document.getElementById(`existencia-row-${index}`);
          detailsRow = document.createElement("tr");
          detailsRow.id = detailsRowId;
          detailsRow.className = "details-row";
          detailsRow.innerHTML = `<td colspan="7">Cargando stock actual...</td>`;
          mainRow.insertAdjacentElement("afterend", detailsRow);
        }

        try {
          const apiUrl = `${specificApiUrl}?referencia=${referencia}`;
          const response = await fetch(apiUrl, { method: "GET" });

          if (!response.ok) {
            throw new Error(`Error: ${response.statusText}`);
          }

          const result = await response.json();
          const data_detail = result.data_detail;

          // Paso 1: Identificar tallas con stock
          const tallasConStock = new Set();

          data_detail.forEach((record) => {
            for (const [key, value] of Object.entries(record)) {
              if (key.startsWith("T") && key.length === 3 && value > 0) {
                tallasConStock.add(key);
              }
            }
          });

          // Convertir a array y ordenar las tallas
          const tallasMostrar = Array.from(tallasConStock).sort((a, b) => {
            const numA = parseInt(a.substring(1));
            const numB = parseInt(b.substring(1));

      async function showDetailsHistorico(referencia, index) {
        const detailsRowId = `details-historico-${index}`;
        let detailsRow = document.getElementById(detailsRowId);

        // Verificar si ya existe la fila de detalles
        if (document.getElementById(detailsRowId)) {
          const existingRow = document.getElementById(detailsRowId);
          existingRow.style.display =
            existingRow.style.display === "none" ? "table-row" : "none";
          return;
        }

        // Preparar la fila de detalles
        if (detailsRow) {
          detailsRow.innerHTML = `<td colspan="7">Cargando histórico...</td>`;
        } else {
          const mainRow = document.getElementById(`row-${index}`);
          detailsRow = document.createElement("tr");
          detailsRow.id = detailsRowId;
          detailsRow.className = "details-row";
          detailsRow.innerHTML = `<td colspan="7">Cargando histórico...</td>`;
          mainRow.insertAdjacentElement("afterend", detailsRow);
        }

        try {
          const apiUrl = `${specificApiUrlHistorico}?referencia=${referencia}`;
          const response = await fetch(apiUrl, { method: "GET" });

          if (!response.ok) {
            throw new Error(`Error: ${response.statusText}`);
          }

          const result = await response.json();
          const data_detail = result.data_detail;

          // Paso 1: Identificar qué columnas tienen datos (excluyendo ceros)
          const columnasConDatos = new Set();

          data_detail.forEach((record) => {
            for (let i = 18; i <= 48; i++) {
              const columna = `T${i}`;
              if (record[columna] !== null && record[columna] !== 0) {
                columnasConDatos.add(columna);
              }
            }
          });

          // Convertir a array y ordenar
          const columnasMostrar = Array.from(columnasConDatos).sort((a, b) => {
            return parseInt(a.substring(1)) - parseInt(b.substring(1));
          });

          // Paso 2: Construir los headers de la tabla dinámicamente
          let headersHtml = `
            <table>
                <thead>
                    <tr>
                        <th style="font-size: 12px">VENTAS TIENDAS</th>
        `;

          // Agregar solo las columnas con datos
          columnasMostrar.forEach((col) => {
            const tallaNum = col.substring(1);
            headersHtml += `<th style="font-size: 12px">${tallaNum}</th>`;
          });

          headersHtml += `<th style="font-size: 12px">TOTAL</th></tr></thead><tbody>`;

          // Paso 3: Construir las filas de datos
          let detailsHtml = headersHtml;

          data_detail.forEach((record) => {
            detailsHtml += `<tr><td style="font-size: 12px">${record.TIENDA}</td>`;

            // Solo agregar celdas para columnas con datos
            columnasMostrar.forEach((col) => {
              const valor = record[col];
              // Determinar estilo según el valor
              const estilo =
                valor === 0
                  ? "font-size: 10px; background-color: transparent; color: black;"
                  : "font-size: 10px; background-color: #90EE90; color: black;";

              // Mostrar valor solo si no es 0
              const contenido = valor === 0 ? "" : valor;

              detailsHtml += `
                    <td style="${estilo}">
                        ${contenido}
                    </td>
                `;
            });

            detailsHtml += `<td style="font-size: 10px">${record.TOTAL}</td></tr>`;
          });

          detailsHtml += `</tbody></table>`;

          // Actualizar la fila con la tabla de detalles optimizada
          detailsRow.innerHTML = `<td colspan="8">${detailsHtml}</td>`;
        } catch (error) {
          detailsRow.innerHTML = `<td colspan="8" class="error">Error al cargar el stock actual: ${error.message}</td>`;
        }
      }

      function filtrarPorTemporada() {
        const checkboxes = document.querySelectorAll(
          '#filtros-temporada input[type="checkbox"]'
        );
        const seleccionadas = Array.from(checkboxes)
          .filter((chk) => chk.checked)
          .map((chk) => chk.value.trim().toUpperCase());

        const tabla = document.querySelector("#table-container table");
        if (!tabla) return;

        const filas = tabla.querySelectorAll("tbody tr");

        filas.forEach((fila) => {
          const celdas = fila.querySelectorAll("td");
          let temporadaTexto = "";
          celdas.forEach((celda, i) => {
            const encabezado = tabla
              .querySelectorAll("th")
              [i].innerText.trim()
              .toUpperCase();
            if (encabezado === "TEMPORADA") {
              temporadaTexto = celda.innerText.trim().toUpperCase();
            }
          });

          const coincide =
            seleccionadas.length === 0 ||
            seleccionadas.includes(temporadaTexto);
          fila.style.display = coincide ? "" : "none";
        });
      }

      function generarCheckboxTemporadas() {
        const tabla = document.querySelector("#table-container table");

        const filas = tabla.querySelectorAll("tbody tr");
        const headers = Array.from(tabla.querySelectorAll("thead th")).map(
          (th) => th.innerText.trim().toUpperCase()
        );
        const idxTemporada = headers.indexOf("TEMPORADA");

      function exportarTablaAExcel() {
        const tabla = document.querySelector("#table-container table");
        if (!tabla) return alert("No hay tabla para exportar.");

        let csv = [];
        for (let fila of tabla.rows) {
          let row = [];
          for (let celda of fila.cells) {
            row.push('"' + celda.innerText.replace(/"/g, '""') + '"');
          }
          csv.push(row.join(","));
        }

        const blob = new Blob([csv.join("\n")], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "existencias.csv";
        link.click();
      }

              "REFPROVEEDOR",
              "DESCRIPCION",
              "COLOR",
              "TIENDA",
              "MOVIMIENTO",
            ].includes(c)
        );

        // Filtro de tallas
        const checkboxesTallas = document.querySelectorAll(".tallaCheckbox");
        const tallasSeleccionadas = Array.from(checkboxesTallas)
          .filter((cb) => cb.checked)
          .map((cb) => cb.value);

        const columnasFiltradas = columnasTalla.filter(
          (talla) =>
            tallasSeleccionadas.length === 0 ||
            tallasSeleccionadas.includes(talla)
        );

        // Filtro de tiendas
        const checkboxesTiendas = document.querySelectorAll(".tiendaCheckbox");
        const tiendasSeleccionadas = Array.from(checkboxesTiendas)
          .filter((cb) => cb.checked)
          .map((cb) => cb.value);

        const datosFiltrados = data.filter(
          (row) =>
            tiendasSeleccionadas.length === 0 ||
            tiendasSeleccionadas.includes(row.TIENDA)
        );

        datosFiltrados.sort((a, b) => {
          const movA = (a.MOVIMIENTO || "").toUpperCase();
          const movB = (b.MOVIMIENTO || "").toUpperCase();
          if (movA < movB) return -1;
          if (movA > movB) return 1;

          const tiendaA = (a.TIENDA || "").toUpperCase();
          const tiendaB = (b.TIENDA || "").toUpperCase();
          if (tiendaA < tiendaB) return -1;
          if (tiendaA > tiendaB) return 1;

          const fechaA = new Date(a.FECHA.split("/").reverse().join("-"));
          const fechaB = new Date(b.FECHA.split("/").reverse().join("-"));
          return fechaB - fechaA; // más reciente primero
        });

        let leyendaHtml = `
        <div style="margin-bottom: 10px; font-size: 12px;">

            </div>
        </div>
    `;

        // Construcción de tabla
        let tableHtml = `<table><thead><tr>`;

        // Fila de título
        const referencia = data[0].REFPROVEEDOR || "";
        const descripcion = data[0].DESCRIPCION || "";
        const color = data[0].COLOR || "";
        tableHtml += `<tr><td colspan="${
          columnasFijas.length + columnasFiltradas.length
        }" style="font-weight: bold; text-align: left; padding: 10px; background-color: black; color: white;">${referencia} - ${descripcion} - ${color}</td></tr>`;

        columnasFijas.forEach((col) => {
          tableHtml += `<th style="font-size: 12px">${col}</th>`;
        });
        columnasFiltradas.forEach((talla) => {
          tableHtml += `<th style="font-size: 12px">${talla}</th>`;
        });
        tableHtml += `</tr></thead><tbody>`;

        // Filas
        datosFiltrados.forEach((row) => {
          tableHtml += `<tr>`;
          columnasFijas.forEach((col) => {
            tableHtml += `<td style="font-size: 10px">${row[col] || ""}</td>`;
          });
          columnasFiltradas.forEach((talla) => {
            const valor = row[talla];
            const destacado = valor !== null && valor !== 0;
            const esVenta = row["MOVIMIENTO"] === "VENTA";
            const esRegularizacion = row["MOVIMIENTO"] === "REGULARIZACIÓN";
            const esRecepcion = row["MOVIMIENTO"] === "RECEPCIÓN DE MERCANCÍA";
            const colorFondo = destacado
              ? esVenta
                ? "#d0f0c0" // verde claro para ventas
                : esRegularizacion
                ? "#fffacd" // amarillo claro para regularizaciones
                : esRecepcion
                ? "#fda28f" // rojo claro para recepciones
                : "#e0f7fa" // azul claro para otros
              : "transparent";

            tableHtml += `<td style="font-size: 10px; background-color: ${colorFondo};">${
              valor === 0 || valor === null ? "" : valor
            }</td>`;
          });
          tableHtml += `</tr>`;
        });

        tableHtml += `</tbody></table>`;
        document.getElementById("table-container").innerHTML =
          leyendaHtml + tableHtml;
      }

          fila.style.display = coincide ? "" : "none";

        const anio = fecha.getFullYear();
        return `${dia}/${mes}/${anio}`;

      //función para renderizar catálogo
      function renderCatalogo(data) {
        if (!Array.isArray(data) || data.length === 0)
          return "<p>Sin datos</p>";

        //imagen para artículos sin foto
        //const imagenGenerica = "./img/foto.jpg";
        const imagenGenerica = "https://abincodigital.loclx.io/imagen-generica";

        // Agrupar artículos por codarticulo
        const articulosMap = new Map();

        data.forEach((item) => {
          const cod = item.codarticulo;

          if (!articulosMap.has(cod)) {
            articulosMap.set(cod, {
              descripcion: item.descripcion,
              descripcionadic: item.descripcionadic,
              foto: item.foto,
              tallas: new Set(),
            });
          }

          articulosMap.get(cod).tallas.add(item.talla);
        });



        // Render catálogo como tabla visual
        let html = `
            <div id="galeria" style="
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                padding: 20px;
            ">
            `;

        articulosMap.forEach((articulo, cod) => {
          //Aquí usamos imagen base64 si hay, si no, usamos la imagen genérica
          const imagenSrc = articulo.foto
            ? `data:image/jpeg;base64,${articulo.foto}`
            : imagenGenerica;

          html += `
        <div class="card" style="
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 5px;
            text-align: center;
            transition: transform 0.2s;
            width: 250px;
            overflow: hidden;
        "
        onmouseover="this.style.transform='scale(1.1)'"
        onmouseout="this.style.transform='scale(1)'"
        >
            <img src="${imagenSrc}" 
              alt="Imagen del artículo" 
              style="
                width: 100%; 
                height: 200px; 
                border-radius: 8px; 
                object-fit: cover; 
                max-height: 200px;">
            
            <h3 style="margin: 10px 0 5px;">${articulo.descripcionadic}</h3>
            <p style="color: #666; font-size: 0.9em;">${
              articulo.descripcion
            }</p>
            <div style="margin-top: 10px;">
                <span style="font-weight: bold;">Tallas disponibles:</span><br>
                <span style="display: inline-block; margin-top: 5px; color: #444;">
                    ${Array.from(articulo.tallas).join(", ")}
                </span>
            </div>
        </div>
    `;
        });
        html += `</div>`;
        return html;
      }

      // Se añade un listener al botón con id "btn-export-pdf"
      async function generarPDF() {
        try {
          /**
           *? Destructurar el objeto "window.jspdf". Pues jspdf.umd.min.js no deja
           *? la clase jsPDF directamente en window, sino que deja un objeto llamado
           *? window.jspdf */
          const { jsPDF } = window.jspdf;
          // Crea nuevo documento PDF en A4 vertical("p")
          const doc = new jsPDF("p", "mm", "a4");
          // Obtener el contenedor #galeria
          const catalogoElement = document.getElementById("galeria");
          if (!catalogoElement) {
            alert("No hay catálogo cargado.");
            return;
          }

          // Obtener todas las tarjetas y las guarda en un NodeList == Array
          const cards = catalogoElement.querySelectorAll(".card");
          const title = document.getElementById("title-catalogo");

          // Configurar dimensiones y layout
          const pageWidth = doc.internal.pageSize.getWidth(); // 210 mm
          const pageHeight = doc.internal.pageSize.getHeight(); // 297 mm
          /**
           *! Límites de la página */
          const margin = 5;
          const cols = 4; // columnas por fila
          const rows = 4; // filas por página

          /**
           *^ Se calculan las dimensiones de cada tarjeta, teniendo en cuenta
           *^ márgenes y espaciado interno entre tarjetas
           */ // 5 = Margen entre columnas
          const cardWidth = (pageWidth - margin * 2 - (cols - 1) * 5) / cols;
          const cardHeight = (pageHeight - margin * 2 - (rows - 1) * 10) / rows;
          // 10 = Margen entre filas
          // Variables de posición y contador
          let x = margin; // 5mm
          let y = margin; // 5mm
          let col = 0;
          let row = 0;
          let padding = 0.5;
          // Pie de página
          let count = 1;

          // Fecha actual, formato de España
          const fecha = new Date().toLocaleDateString("es-ES");

          // Añadir encabezado SOLO en la primera página
          doc.setFontSize(16);
          doc.text(title.innerText, margin, 12);
          doc.setFontSize(10);
          doc.text(`Fecha: ${fecha}`, margin, 18);

          // Ajustar margen superior de la primera página
          y = 20;

          /**
           *^ Se recorre cada una de las tarjetas HTML seleccionadas antes. */
          for (let i = 0; i < cards.length; i++) {
            // Una tarjeta en el orden del NodeList de tarjetas
            const card = cards[i];
            // Subelementos de cada tarjeta
            const imgEl = card.querySelector("img");
            const h3 = card.querySelector("h3");

            /**
             *? Si h3 es null o undefined, no lanza un error, simplemente
             *? devuelve undefined. */
            const cod = h3?.textContent.trim() || ""; // .trim() quita espacios
            const desc = card.querySelector("p")?.textContent.trim() || "";
            const tallas =
              card.querySelector("span:last-of-type")?.textContent.trim() || "";

            // Procesar imagen
            const imgSrc = imgEl?.src || "";
            // Comprueba si la foto está en data:image/jpeg;base64,/9j/4AAQSkZ...
            const isBase64 = imgSrc.startsWith("data:image");
            const finalImage = isBase64
              ? imgSrc
              : "https://abincodigital.loclx.io/imagen-generica";

            let base64Image = finalImage;
            if (!isBase64) {
              base64Image = await toDataUrl(finalImage);
            }

            /**
             *? Se inserta la imagen en la posición actual (x, y) ocupando
             *? la mitad superior del espacio del card. */
            const imgHeight = cardHeight * 0.6;
            doc.addImage(
              base64Image,
              "JPEG",
              x + padding,
              y + padding,
              cardWidth - padding * 2,
              imgHeight - padding
            );

            // Borde con esquinas redondeadas
            doc.setDrawColor(255, 255, 255);
            doc.setLineWidth(1.5);
            doc.roundedRect(x, y, cardWidth, cardHeight, 2.5, 2.5, "S");

            doc.setDrawColor(237, 232, 228);
            doc.setLineWidth(0.5);
            doc.roundedRect(x, y, cardWidth, cardHeight, 2.5, 2.5, "S");

            /**
             *~ Se añaden tres líneas de texto debajo de la imagen
             *~ con espaciado vertical entre ellas. */
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text(cod, x + padding * 3, y + imgHeight + 5, {
              maxWidth: cardWidth - padding * 6,
            });
            doc.setFontSize(7);
            doc.setFont("helvetica", "normal");
            doc.text(desc, x + padding * 3, y + imgHeight + 12, {
              maxWidth: cardWidth - padding * 6,
            });
            doc.text("Tallas: " + tallas, x + padding * 3, y + imgHeight + 19, {
              maxWidth: cardWidth - padding * 6,
            });
            /**
             ** Se avanza a la siguiente columna.
             ** Si ya se completó una fila (col >= cols), se reinicia la columna
             ** y se baja una fila (row++). */
            col++;
            if (col >= cols) {
              col = 0;
              row++;
              x = margin;
              y += cardHeight + 3;
            } else {
              x += cardWidth + 5;
            }
            /**
             *^ Si ya se colocaron todas las filas posibles (16 tarjetas) y aún
             *^ hay más tarjetas, se añade una nueva página. La posición se
             *^ reinicia arriba (y = margin) porque solo la primera página tiene
             *^ encabezado. */
            if (row >= rows && i < cards.length - 1) {
              doc.text(
                "Página " + count,
                pageWidth - margin * 3,
                pageHeight - margin * 1.2,
                { maxWidth: cardWidth - padding * 6 }
              );
              doc.addPage();
              row = 0;
              col = 0;
              x = margin;
              y = margin;
              count++;
            }
          }

          doc.save("catalogo_productos.pdf");
        } catch (error) {
          console.error("Error al generar PDF:", error);
        }
      }





      // Utilidad: convierte imagen externa a base64
      async function toDataUrl(url) {
        const res = await fetch(url);
        /**
         * Convierte la respuesta en un Blob, es decir, en un archivo binario
         * en memoria, que representa los datos de la imagen. */
        const blob = await res.blob();
        return new Promise((resolve) => {
          /**
           * Instanciar FileReader, que se encarga de leer archivos (como Blob)
           * y convertirlos a texto o base64.*/
          const reader = new FileReader();
          // 2. Cuando termine de leer (pasar a base64)
          reader.onloadend = () => {
            // Devuleve el resultado de la lectura a la Promise
            return resolve(reader.result);
          };
          // 1. Bianrio lo pasamos a base64
          reader.readAsDataURL(blob);
        });
      }

      function renderMiniTable(data, tipo = "") {
        if (!Array.isArray(data) || data.length === 0)
          return "<p>Sin datos</p>";

        // Identificar columnas a mostrar (las que tienen al menos un valor != 0)
        const allKeys = Object.keys(data[0]);
        const columnsToShow = new Set();

        // Siempre mostrar estas columnas
        const mandatoryColumns = [
          "DESCRIPCION",
          "REFPROVEEDOR",
          "REFERENCIA",
          "TIENDA",
          "TOTAL",
        ];

        // Primero añadimos las columnas obligatorias
        mandatoryColumns.forEach((col) => {
          if (allKeys.includes(col)) columnsToShow.add(col);
        });

        // Luego analizamos columnas de tallas (que empiezan por T seguido de número)
        const sizeColumns = allKeys.filter((key) => /^T\d+$/.test(key));

        // Verificar qué tallas tienen al menos un valor distinto de 0
        sizeColumns.forEach((col) => {
          const hasNonZero = data.some((item) => item[col] !== 0.0);
          if (hasNonZero) columnsToShow.add(col);
        });

        // Convertir Set a Array para mantener orden consistente
        const headers = allKeys.filter((key) => columnsToShow.has(key));

        // Generar la tabla HTML
        let html =
          "<div class='table-responsive'><table class='table table-striped table-bordered'><thead><tr>";
        headers.forEach((h) => (html += `<th>${h}</th>`));
        html += "</tr></thead><tbody>";

        data.forEach((row) => {
          html += "<tr>";
          headers.forEach((h) => {
            const valor = row[h];
            const mostrar =
              valor === 0 || valor === null || valor === undefined ? "" : valor;
            let bgColor = "transparent";

            if (typeof valor === "number" && valor !== 0) {
              bgColor =
                tipo === "stock"
                  ? "rgba(255, 255, 0, 0.3)"
                  : tipo === "ventas"
                  ? "rgba(144, 238, 144, 0.3)"
                  : "transparent";
            }

            html += `<td style="background-color: ${bgColor}; color: black; text-align: center;">${mostrar}</td>`;
          });
          html += "</tr>";
        });

        html += "</tbody></table></div>";
        return html;
      }

      function showArticuloImage(referencia) {
        // Realizamos la petición para obtener la imagen desde la API
        fetch(
          `https://abincodigital.loclx.io/articulo/foto?referencia=${referencia}`
        )
          .then((response) => {
            if (!response.ok) {
              throw new Error("Imagen no encontrada");
            }

            // Verificamos el tipo de contenido
            const contentType = response.headers.get("Content-Type");
            if (!contentType || !contentType.startsWith("image/")) {
              throw new Error("La respuesta no es una imagen");
            }

            // Obtener la imagen como Blob
            return response.blob();
          })
          .then((imageBlob) => {
            // Crear una URL local para la imagen
            const imageUrl = URL.createObjectURL(imageBlob);
            showImageInModal(imageUrl); // Función para mostrar la imagen en un modal
          })
          .catch((error) => {
            console.error("Error al cargar la imagen:", error);
            alert("Error al cargar la imagen: " + error.message); // Mostrar el error al usuario
          });
      }

      function showImageInModal(imageUrl) {
        // Crear un modal para mostrar la imagen
        const modal = document.createElement("div");
        modal.style.position = "fixed";
        modal.style.top = "0";
        modal.style.left = "0";
        modal.style.width = "100%";
        modal.style.height = "100%";
        modal.style.backgroundColor = "rgba(0, 0, 0, 0.7)";
        modal.style.display = "flex";
        modal.style.justifyContent = "center";
        modal.style.alignItems = "center";
        modal.style.zIndex = "1000";

        const img = document.createElement("img");
        img.src = imageUrl;
        img.style.maxWidth = "90%";
        img.style.maxHeight = "90%";

        const closeBtn = document.createElement("button");
        closeBtn.textContent = "Cerrar";
        closeBtn.style.position = "absolute";
        closeBtn.style.top = "20px";
        closeBtn.style.right = "20px";
        closeBtn.style.fontSize = "20px";
        closeBtn.style.padding = "10px 20px";
        closeBtn.style.backgroundColor = "red";
        closeBtn.style.color = "white";
        closeBtn.style.border = "none";
        closeBtn.style.cursor = "pointer";

        closeBtn.addEventListener("click", () => {
          modal.remove();
        });

        modal.appendChild(img);
        modal.appendChild(closeBtn);
        document.body.appendChild(modal);
      }

      function cargarResumenFormasPago() {
        const fechaInicio = document.getElementById("fecha-ventas").value;
        const fechaFin = document.getElementById("fecha-final").value;

        if (!fechaInicio || !fechaFin) {
          document.getElementById("resumenFormasPago").innerHTML = "";
          return;
        }

        fetch(
          `http://abincodigital.loclx.io/formas-pago/resumen?tienda=Z04&fechaini=${fechaInicio}&fechafin=${fechaFin}`
        )
          .then((res) => res.json())
          .then((data) => {
            const resumenDiv = document.getElementById("resumenFormasPago");

            if (data.error) {
              resumenDiv.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
              return;
            }

            if (data.length === 0) {
              resumenDiv.innerHTML = "<p>No hay datos de formas de pago.</p>";
              return;
            }

            let html = "<h4>Resumen por Forma de Pago</h4>";
            html +=
              "<table class='table table-bordered'><thead><tr><th>Forma de Pago</th><th>Total</th></tr></thead><tbody>";

            data.forEach((item) => {
              html += `<tr><td>${
                item.formapago
              }</td><td>${item.total_importe.toFixed(2)}</td></tr>`;
            });

            html += "</tbody></table>";
            resumenDiv.innerHTML = html;
          })
          .catch((err) => {
            console.error("Error al cargar resumen de formas de pago:", err);
            document.getElementById("resumenFormasPago").innerHTML =
              "<p class='text-danger'>Error al cargar resumen</p>";
          });
      }
