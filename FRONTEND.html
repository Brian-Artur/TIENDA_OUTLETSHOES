    function esperarImagenesCargadas(contenedor) {
        const imagenes = contenedor.querySelectorAll("img");
        const promesas = Array.from(imagenes).map(img => {
            if (img.complete && img.naturalHeight !== 0) return Promise.resolve();
            return new Promise(resolve => {
                img.onload = img.onerror = resolve;
            });
        });
    return Promise.all(promesas);
    }


        // Función para obtener ventas realizadas
        async function fetchLambdaResult() {
            try {
                tableContainer.innerHTML = "Obteniendo registros...";
                const response = await fetch(lambdaApiUrl, {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.statusText}`);
                }

                const jsonData = await response.json();

                // Procesar solo el campo "data"
                if (jsonData.data && Array.isArray(jsonData.data)) {
                    renderTable(jsonData.data);
                } else {
                    tableContainer.innerHTML = '<p class="error">No "data" field found in the response or data is not an array.</p>';
                }
            } catch (error) {
                tableContainer.innerHTML = `<p class="error">Error fetching data: ${error.message}</p>`;
            }
        }

function filtrarPorTemporada() {
    const checkboxes = document.querySelectorAll('#filtros-temporada input[type="checkbox"]');
    const seleccionadas = Array.from(checkboxes)
        .filter(chk => chk.checked)
        .map(chk => chk.value.trim().toUpperCase());

    const tabla = document.querySelector("#table-container table");
    if (!tabla) return;

    const filas = tabla.querySelectorAll("tbody tr");

    filas.forEach(fila => {
        const celdas = fila.querySelectorAll("td");
        let temporadaTexto = "";
        celdas.forEach((celda, i) => {
            const encabezado = tabla.querySelectorAll("th")[i].innerText.trim().toUpperCase();
            if (encabezado === "TEMPORADA") {
                temporadaTexto = celda.innerText.trim().toUpperCase();
            }
        });

        const coincide = seleccionadas.length === 0 || seleccionadas.includes(temporadaTexto);
        fila.style.display = coincide ? "" : "none";
    });
}

function generarCheckboxTemporadas() {
    const tabla = document.querySelector("#table-container table");
    if (!tabla) return;

    const filas = tabla.querySelectorAll("tbody tr");
    const headers = Array.from(tabla.querySelectorAll("thead th")).map(th => th.innerText.trim().toUpperCase());
    const idxTemporada = headers.indexOf("TEMPORADA");
    if (idxTemporada === -1) return;

    const temporadasUnicas = new Set();
    filas.forEach(fila => {
        const celdas = fila.querySelectorAll("td");
        const temporada = (celdas[idxTemporada]?.innerText || '').trim().toUpperCase();
        if (temporada) {
            temporadasUnicas.add(temporada);
        }
    });

    const contenedor = document.getElementById("filtros-temporada");
    if (!contenedor) return;

    contenedor.innerHTML = "<strong>Filtrar por temporada:</strong><br>";
    [...temporadasUnicas].sort().forEach(temp => {
        const id = "chk_" + temp.replace(/\s+/g, "_");
        const checked = (temp === "V24" || temp === "V25") ? "checked" : "";
        contenedor.innerHTML += `
            <label style="margin-right: 10px;">
                <input type="checkbox" value="${temp}" onchange="filtrarPorTemporada()" ${checked}> ${temp}
            </label>
        `;
    });

    // Aplicar filtro automáticamente
    filtrarPorTemporada();
}

function exportarTablaAExcel() {
    const tabla = document.querySelector("#table-container table");
    if (!tabla) return alert("No hay tabla para exportar.");

    let csv = [];
    for (let fila of tabla.rows) {
        let row = [];
        for (let celda of fila.cells) {
            row.push('"' + celda.innerText.replace(/"/g, '""') + '"');
        }
        csv.push(row.join(","));
    }

    const blob = new Blob([csv.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "existencias.csv";
    link.click();
}

async function exportarTablaAPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });

    const tabla = document.querySelector("#table-container table");
    if (!tabla) {
        alert("No hay tabla para exportar.");
        return;
    }

    const fechaInicio = document.getElementById("fecha-ventas")?.value || "Fecha inicio no seleccionada";
    const fechaFin = document.getElementById("fecha-final")?.value || "Fecha final no seleccionada";

    const filas = Array.from(tabla.querySelectorAll("tr"));
    const headRows = [];
    const bodyRows = [];
    let inHeader = true;

    for (const fila of filas) {
        const row = [];
        for (const cell of fila.children) {
            const colspan = parseInt(cell.getAttribute("colspan") || "1");
            const text = cell.innerText.trim();
            for (let i = 0; i < colspan; i++) {
                row.push(i === 0 ? text : "");
            }
        }

        if (inHeader && fila.querySelectorAll("th").length > 0) {
            headRows.push(row);
        } else {
            inHeader = false;
            bodyRows.push(row);
        }
    }

    // Dibujar encabezado solo en la primera hoja
    const marginLeft = 40;
    const headerStartY = 40;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(40);
    doc.text("CUADRO DE BENEFICIOS POR PROVEEDOR - CALZADOS BREOGÁN, S.L.", marginLeft, headerStartY);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Fechas seleccionadas: ${fechaInicio} a ${fechaFin}`, marginLeft, headerStartY + 20);

    // Dibujar tabla dejando espacio para el encabezado solo en la primera página
    doc.autoTable({
        head: headRows,
        body: bodyRows,
        startY: headerStartY + 40,
        margin: { left: marginLeft, right: marginLeft },
        theme: "grid",
        styles: {
            fontSize: 6,
            cellPadding: 2,
            overflow: "linebreak"
        },
        headStyles: {
            fillColor: [230, 230, 230],
            textColor: 20,
            fontSize: 7
        }
    });

    doc.save("cuadro-beneficios.pdf");
}

async function fetchCuadroBeneficios() {
    const tableContainer = document.getElementById('table-container');
    document.getElementById("filtros-temporada").innerHTML = "";

    const fechaInicioRaw = document.getElementById("fecha-ventas").value;
    const fechaFinRaw = document.getElementById("fecha-final").value;

    if (!fechaInicioRaw || !fechaFinRaw) {
        tableContainer.innerHTML = "<p class='error'>Selecciona ambas fechas: inicial y final.</p>";
        return;
    }

    // Formatear fechas como dd/mm/yyyy
    const [yi, mi, di] = fechaInicioRaw.split("-");
    const [yf, mf, df] = fechaFinRaw.split("-");
    const fechaInicio = `${di}/${mi}/${yi}`;
    const fechaFin = `${df}/${mf}/${yf}`;
    

    const url = `https://abincodigital.loclx.io/cuadrobeneficios?fechaini=${encodeURIComponent(fechaInicio)}&fechafin=${encodeURIComponent(fechaFin)}`;

    try {
        tableContainer.innerHTML = "Obteniendo datos del informe por Proveedores...";

        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Error: ${response.statusText}`);
        }

        const jsonData = await response.json();

        if (jsonData.data && Array.isArray(jsonData.data)) {
            renderTableCuadroBeneficios(jsonData.data);
        } else {
            tableContainer.innerHTML = "<p class='error'>No se encontraron datos válidos en la respuesta.</p>";
        }
    } catch (error) {
        tableContainer.innerHTML = `<p class='error'>Error al obtener el cuadro de beneficios: ${error.message}</p>`;
    }
}

function renderTableCuadroBeneficios(data) {

                    <th style="text-align: right;">COMPRA</th>
                    <th style="text-align: right;">PMC</th>

                    <th style="text-align: right;">PMV</th>

                    <th style="text-align: right;">VALORACIÓN</th>

                </tr>

            <tbody>
                ${data.map(row => `
                    <tr>
                        <td>${row.PROVEEDOR}</td>

                        <td style="text-align: right;">${row.VALORCOMPRA ?? 0}</td>

                        <td style="text-align: right;">${row.UNIDADESVENDIDAS ?? 0}</td>
                        <td style="text-align: right;">${row.VALORVENTA ?? 0}</td>
                        <td style="text-align: right;">${row.PMV ?? 0}</td>
                        <td style="text-align: right;">${row.STOCK ?? 0}</td>
                        <td style="text-align: right;">${row.VALORACION ?? 0}</td>
                        <td style="text-align: right;">${row.COSTO_VTA ?? 0}</td>
                    </tr>
                `).join("")}
            </tbody>
            <tfoot>

                    <td><strong>Total</strong></td>

                    <td style="text-align: right;" id="total-valor-venta"></td>
                    <td style="text-align: right;" id="total-pmv"></td>
                    <td style="text-align: right;" id="total-stock"></td> 
                    <td style="text-align: right;" id="total-valoracion"></td> 
                    <td style="text-align: right;" id="total-coste-venta"></td> 
                </tr>
            </tfoot>
        </table>
    `;

    document.getElementById("filtros-temporada").innerHTML = "";
    document.getElementById("table-container").innerHTML = tableHtml;

    function getNumericValue(cell) {
        const value = parseFloat(cell.textContent.replace(",", ".").replace(/[^0-9.-]/g, ""));
        return isNaN(value) ? 0 : value;
    }

    let totalCompradas = 0;
    let totalValorCompra = 0;
    let totalVendidas = 0;
    let totalValorVenta = 0;
    let totalStock = 0;
    let totalValoracion = 0;
    let totalCosteVenta = 0;

    const rows = document.querySelectorAll("table tbody tr");

    rows.forEach(row => {
        const cells = row.querySelectorAll("td");
        totalCompradas += getNumericValue(cells[1]);
        totalValorCompra += getNumericValue(cells[2]);
        totalVendidas += getNumericValue(cells[4]);
        totalValorVenta += getNumericValue(cells[5]);
        totalStock += getNumericValue(cells[7]);
        totalValoracion += getNumericValue(cells[8]);
        totalCosteVenta += getNumericValue(cells[9]);
    });

    document.getElementById("total-compradas").textContent = totalCompradas;
    document.getElementById("total-valor-compra").textContent = totalValorCompra.toFixed(2);
    document.getElementById("total-vendidas").textContent = totalVendidas;
    document.getElementById("total-valor-venta").textContent = totalValorVenta.toFixed(2);
    document.getElementById("total-stock").textContent = totalStock;
    document.getElementById("total-valoracion").textContent = totalValoracion.toFixed(2);
    document.getElementById("total-coste-venta").textContent = totalCosteVenta.toFixed(2);

    const pmc = totalCompradas ? (totalValorCompra / totalCompradas) : 0;
    const pmv = totalVendidas ? (totalValorVenta / totalVendidas) : 0;

    document.getElementById("total-pmc").textContent = pmc.toFixed(2);
    document.getElementById("total-pmv").textContent = pmv.toFixed(2);

}

    try {

        });

        /**

        const jsonData = await response.json();

        /**

/**
 **! Renderizar tabla "Histórico" para un producto */
function renderHistoricoStock(data) {
    if (!Array.isArray(data) || data.length === 0) {
        document.getElementById("table-container").innerHTML = "<p class='error'>No hay datos para mostrar.</p>";
        return;
    }

    // Detectar columnas base y columnas de talla
    /**
    **! 3 Columnas de la izquierda */
    const columnasFijas = ["MOVIMIENTO", "TIENDA", "FECHA"];
    const todasColumnas = Object.keys(data[0]);
    const columnasTalla = todasColumnas.filter(c => !["FECHA", "REFPROVEEDOR", "DESCRIPCION", "COLOR", "TIENDA", "MOVIMIENTO"].includes(c));

    // Filtro de tallas
    const checkboxesTallas = document.querySelectorAll(".tallaCheckbox");
    const tallasSeleccionadas = Array.from(checkboxesTallas)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

    /**
    **! Columnas de la derecha (tallas) */
    const columnasFiltradas = columnasTalla.filter(talla =>
        tallasSeleccionadas.length === 0 || tallasSeleccionadas.includes(talla)
    );

    // Filtro de tiendas
    const checkboxesTiendas = document.querySelectorAll(".tiendaCheckbox");
    const tiendasSeleccionadas = Array.from(checkboxesTiendas)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

    const datosFiltrados = data.filter(row =>
        tiendasSeleccionadas.length === 0 || tiendasSeleccionadas.includes(row.TIENDA)
    );

    datosFiltrados.sort((a, b) => {
        const movA = (a.MOVIMIENTO || "").toUpperCase();
        const movB = (b.MOVIMIENTO || "").toUpperCase();
        if (movA < movB) return -1;
        if (movA > movB) return 1;

        const tiendaA = (a.TIENDA || "").toUpperCase();
        const tiendaB = (b.TIENDA || "").toUpperCase();
        if (tiendaA < tiendaB) return -1;
        if (tiendaA > tiendaB) return 1;

        const fechaA = new Date(a.FECHA.split("/").reverse().join("-"));
        const fechaB = new Date(b.FECHA.split("/").reverse().join("-"));
        return fechaB - fechaA; // más reciente primero
    });


    let leyendaHtml = `
        <div style="margin-bottom: 10px; font-size: 12px;">
            <strong>Leyenda de colores:</strong>
            <div style="display: flex; gap: 20px; margin-top: 5px;">
                <div><span style="display: inline-block; width: 15px; height: 15px; background-color: #d0f0c0; border: 1px solid #ccc;"></span> Venta</div>
                <div><span style="display: inline-block; width: 15px; height: 15px; background-color: #fda28f; border: 1px solid #ccc;"></span> Recepción de Mercancía</div>
                <div><span style="display: inline-block; width: 15px; height: 15px; background-color: #fffacd; border: 1px solid #ccc;"></span> Regularización</div>
                <div><span style="display: inline-block; width: 15px; height: 15px; background-color: #e0f7fa; border: 1px solid #ccc;"></span> Traspasos</div>
            </div>
        </div>
    `;


    // Construcción de tabla
    let tableHtml = `<table><thead><tr>`;

    // Fila de título
    const referencia = data[0].REFPROVEEDOR || "";
    const descripcion = data[0].DESCRIPCION || "";
    const color = data[0].COLOR || "";
    /**
    **! Sobre-encabezado negro de la tabla */
    tableHtml += `<tr><td colspan="${columnasFijas.length + columnasFiltradas.length}" style="font-weight: bold; text-align: left; padding: 10px; background-color: black; color: white;">${referencia} - ${descripcion} - ${color}</td></tr>`;

    columnasFijas.forEach(col => {
        tableHtml += `<th style="font-size: 12px">${col}</th>`;
    });
    columnasFiltradas.forEach(talla => {
        tableHtml += `<th style="font-size: 12px">${talla}</th>`;
    });
    tableHtml += `</tr></thead><tbody>`;

    // Filas
    datosFiltrados.forEach(row => {
        tableHtml += `<tr>`;
        columnasFijas.forEach(col => {
            tableHtml += `<td style="font-size: 10px">${row[col] || ""}</td>`;
        });
        columnasFiltradas.forEach(talla => {
            const valor = row[talla];
            const destacado = valor !== null && valor !== 0;
            const esVenta = row["MOVIMIENTO"] === "VENTA";
            const esRegularizacion= row["MOVIMIENTO"] === "REGULARIZACIÓN";
            const esRecepcion= row["MOVIMIENTO"] === "RECEPCIÓN DE MERCANCÍA";
            const colorFondo = destacado
                ? esVenta
                    ? "#d0f0c0"  // verde claro para ventas
                    : esRegularizacion
                        ? "#fffacd" // amarillo claro para regularizaciones
                        : esRecepcion
                            ? "#fda28f" // rojo claro para recepciones
                            : "#e0f7fa" // azul claro para otros
                : "transparent";

            tableHtml += `<td style="font-size: 10px; background-color: ${colorFondo};">${valor === 0 || valor === null ? "" : valor}</td>`;
        });
        tableHtml += `</tr>`;
    });

    tableHtml += `</tbody></table>`;
    document.getElementById("table-container").innerHTML = leyendaHtml + tableHtml;
}


function generarCheckboxTallas(data) {
    const tallasUnicas = new Set();
    data.forEach(record => {
        if (record.TALLA) {
            tallasUnicas.add(record.TALLA);
        }
    });

    const contenedor = document.getElementById("filtros-temporada");
    if (!contenedor) return;

    contenedor.innerHTML = "<strong>Filtrar por talla:</strong><br>";
    [...tallasUnicas].sort().forEach(talla => {
        const id = "chk_" + talla.replace(/\s+/g, "_");
        contenedor.innerHTML += `
            <label style="margin-right: 10px;">
                <input type="checkbox" value="${talla}" onchange="filtrarPorTalla()"> ${talla}
            </label>
        `;
    });
}

function filtrarPorTalla() {
    const checkboxes = document.querySelectorAll('#filtros-temporada input[type="checkbox"]');
    const seleccionadas = Array.from(checkboxes)
        .filter(chk => chk.checked)
        .map(chk => chk.value.trim());

    const tabla = document.querySelector("#table-container table");
    if (!tabla) return;

    const filas = tabla.querySelectorAll("tbody tr");

    filas.forEach(fila => {
        const talla = fila.cells[3]?.innerText.trim();
        const coincide = seleccionadas.length === 0 || seleccionadas.includes(talla);
        fila.style.display = coincide ? "" : "none";
    });
}

function formatearFecha(fechaISO) {
    const fecha = new Date(fechaISO);
    const dia = String(fecha.getDate()).padStart(2, '0');
    const mes = String(fecha.getMonth() + 1).padStart(2, '0'); // Los meses empiezan en 0
    const anio = fecha.getFullYear();
    return `${dia}/${mes}/${anio}`;
}

//función para renderizar catálogo
function renderCatalogo(data) {
    if (!Array.isArray(data) || data.length === 0) return "<p>Sin datos</p>";

    //imagen para artículos sin foto
    //const imagenGenerica = "./img/articulo-sin-foto.png";
    const imagenGenerica = "http://localhost:5000/imagen-generica";

    // Agrupar artículos por codarticulo
    const articulosMap = new Map();

    data.forEach(item => {
        const cod = item.codarticulo;

        if (!articulosMap.has(cod)) {
            articulosMap.set(cod, {
                descripcion: item.descripcion,
                descripcionadic: item.descripcionadic,
                foto: item.foto,
                tallas: new Set()
            });
        }

        articulosMap.get(cod).tallas.add(item.talla);
    });

    // Render catálogo como tabla visual
    let html = `
  <div id="galeria" style="
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
  ">
`;

articulosMap.forEach((articulo, cod) => {
     //Aquí usamos imagen base64 si hay, si no, usamos la imagen genérica
        const imagenSrc = articulo.foto
            ? `data:image/jpeg;base64,${articulo.foto}`
            : imagenGenerica;

    html += `
        <div style="
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        "
        onmouseover="this.style.transform='scale(1.02)'"
        onmouseout="this.style.transform='scale(1)'"
        >
            <img src="${imagenSrc}" 
                 alt="Imagen del artículo" 
                 style="width: 100%; height: auto; border-radius: 8px; object-fit: cover; max-height: 200px;">
            
            <h3 style="margin: 10px 0 5px;">${articulo.descripcion}</h3>
            <p style="color: #666; font-size: 0.9em;">Código: <strong>${articulo.descripcionadic}</strong></p>
            <div style="margin-top: 10px;">
                <span style="font-weight: bold;">Tallas disponibles:</span><br>
                <span style="display: inline-block; margin-top: 5px; color: #444;">
                    ${Array.from(articulo.tallas).join(', ')}
                </span>
            </div>
        </div>
    `;
});
    html += `</div>`;
    return html;
}

// Función auxiliar para esperar carga de imágenes
function esperarImagenesCargadas(container) {
    const images = container.getElementsByTagName('img');
    const promises = [];
    
    for (const img of images) {
        if (!img.complete || img.naturalHeight === 0) {
            promises.push(new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error(`Error cargando imagen: ${img.src}`));
            }));
        }
    }
    
    return Promise.all(promises);
}

function renderMiniTable(data, tipo = "") {
    if (!Array.isArray(data) || data.length === 0) return "<p>Sin datos</p>";

    const headers = Object.keys(data[0]);
    let html = "<table><thead><tr>";
    headers.forEach(h => html += `<th>${h}</th>`);
    html += "</tr></thead><tbody>";

    data.forEach(row => {
        html += "<tr>";
        headers.forEach(h => {
            const valor = row[h];
            const mostrar = (valor === 0 || valor === null) ? "" : valor;
            let bgColor = "transparent";

            if (typeof valor === "number" && valor !== 0) {
                bgColor = tipo === "stock" ? "yellow" : tipo === "ventas" ? "#90EE90" : "transparent";
            }

            html += `<td style="background-color: ${bgColor}; color: black;">${mostrar}</td>`;
        });
        html += "</tr>";
    });

    html += "</tbody></table>";
    return html;
}


function imprimirTicket() {
    const tabla = document.querySelector("#table-container table");
    if (!tabla) return alert("No hay datos para imprimir.");

    const filas = Array.from(tabla.querySelectorAll("tbody tr"));
    let html = `
        <html>
        <head>
            <style>
                body {
                    font-family: monospace;
                    font-size: 10px;
                    margin: 0;
                    padding: 10px;

    filas.forEach(fila => {

            const talla = celdas[2].innerText;

            const importe = celdas[5].innerText;
            html += `<tr>

                        <td>${unidades}</td>
                        <td>${importe}</td>
                    </tr>`;
        }
    });

    html += `
                </tbody>
            </table>
        </body>
        </html>
    `;

    const printWindow = window.open("", "", "width=400,height=600");
    printWindow.document.write(html);
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
    printWindow.close();
}

function showArticuloImage(referencia) {
    // Realizamos la petición para obtener la imagen desde la API
    fetch(`https://abincodigital.loclx.io/articulo/foto?referencia=${referencia}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Imagen no encontrada');
            }

            // Verificamos el tipo de contenido
            const contentType = response.headers.get('Content-Type');
            if (!contentType || !contentType.startsWith('image/')) {
                throw new Error('La respuesta no es una imagen');
            }

            // Obtener la imagen como Blob
            return response.blob();
        })
        .then(imageBlob => {
            // Crear una URL local para la imagen
            const imageUrl = URL.createObjectURL(imageBlob);
            showImageInModal(imageUrl);  // Función para mostrar la imagen en un modal
        })
        .catch(error => {
            console.error('Error al cargar la imagen:', error);
            alert('Error al cargar la imagen: ' + error.message);  // Mostrar el error al usuario
        });
}

function showImageInModal(imageUrl) {
    // Crear un modal para mostrar la imagen
    const modal = document.createElement('div');
    modal.style.position = 'fixed';
    modal.style.top = '0';
    modal.style.left = '0';
    modal.style.width = '100%';
    modal.style.height = '100%';
    modal.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
    modal.style.display = 'flex';
    modal.style.justifyContent = 'center';
    modal.style.alignItems = 'center';
    modal.style.zIndex = '1000';

    const img = document.createElement('img');
    img.src = imageUrl;
    img.style.maxWidth = '90%';
    img.style.maxHeight = '90%';

    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Cerrar';
    closeBtn.style.position = 'absolute';
    closeBtn.style.top = '20px';
    closeBtn.style.right = '20px';
    closeBtn.style.fontSize = '20px';
    closeBtn.style.padding = '10px 20px';
    closeBtn.style.backgroundColor = 'red';
    closeBtn.style.color = 'white';
    closeBtn.style.border = 'none';
    closeBtn.style.cursor = 'pointer';

    closeBtn.addEventListener('click', () => {
        modal.remove();
    });

    modal.appendChild(img);
    modal.appendChild(closeBtn);
    document.body.appendChild(modal);
}

function cargarResumenFormasPago() {
  const fechaInicio = document.getElementById("fecha-ventas").value;
  const fechaFin = document.getElementById("fecha-final").value;

  if (!fechaInicio || !fechaFin) {
    document.getElementById("resumenFormasPago").innerHTML = "";
    return;
  }

  fetch(`http://abincodigital.loclx.io/formas-pago/resumen?tienda=Z04&fechaini=${fechaInicio}&fechafin=${fechaFin}`)
    .then(res => res.json())
    .then(data => {
      const resumenDiv = document.getElementById("resumenFormasPago");

      if (data.error) {
        resumenDiv.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
        return;
      }

      if (data.length === 0) {
        resumenDiv.innerHTML = "<p>No hay datos de formas de pago.</p>";
        return;
      }

      let html = "<h4>Resumen por Forma de Pago</h4>";
      html += "<table class='table table-bordered'><thead><tr><th>Forma de Pago</th><th>Total</th></tr></thead><tbody>";

      data.forEach(item => {
        html += `<tr><td>${item.formapago}</td><td>${item.total_importe.toFixed(2)}</td></tr>`;
      });

      html += "</tbody></table>";
      resumenDiv.innerHTML = html;
    })
    .catch(err => {
      console.error("Error al cargar resumen de formas de pago:", err);
      document.getElementById("resumenFormasPago").innerHTML = "<p class='text-danger'>Error al cargar resumen</p>";
    });
}
